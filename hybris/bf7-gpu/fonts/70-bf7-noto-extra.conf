<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  BF7: спрятать от fontconfig пакет fonts-noto-extra (1540 начертаний Noto на
  все письменности мира). Его тянет retroarch-assets, а RetroArch грузит
  шрифты по пути, мимо fontconfig, — ему это не мешает.

  Зачем. 1) Обычного Noto Sans в нём нет (он в fonts-noto-core), только
  доп. ширины и насыщенности, и вместо шрифта интерфейса подставлялся
  «Noto Sans SemiCondensed» — сжатый. 2) При каждом запуске GTK-приложения
  pango перебирает все шрифты: fontconfig занимал 24% времени запуска
  калькулятора (perf, 2026-09-25). Шрифт интерфейса — Cantarell
  (fonts-cantarell), запасной — DejaVu.

  Оставлены: цветные эмодзи и моноширинный Noto (он у консоли).
-->
<fontconfig>
  <selectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSansMono*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoMono*</glob>
    </acceptfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
