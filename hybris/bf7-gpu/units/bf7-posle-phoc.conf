# BF7: при выключении системы — останавливаться только после выхода phoc.
#
# Вставка (drop-in) для служб, работающих с теми же буферами GPU/ION и
# памятью M4U, что и композитор: камера, видеодекодер, распределитель gralloc,
# модем. 2026-09-24: после сна перезагрузка вставала на 28-150 с, когда phoc
# выходил одновременно с ними (3 пробы из 3); если phosh остановить заранее —
# сброс платы через 2,1 с (3 из 3).
#
# Ставится на bf7-android-hal, bf7-videod, bf7-modem. НЕ на bf7-camd и
# bf7-camera: у них After=bf7-phosh, при выключении они и так уходят раньше
# него, и ожидание phoc давало взаимную блокировку (2x10 с, замер 24 с).
#
# Порядок через After= задержал бы появление экрана при загрузке (~1,4 с),
# поэтому ждём только при выключении: `systemctl is-system-running` отвечает
# «stopping». Отдельный `systemctl restart` службы не ждёт ничего. Больше 10 с
# не ждём — выключение не должно вставать из-за этой вставки.
[Service]
ExecStop=/bin/sh -c '[ "$(systemctl is-system-running 2>/dev/null)" = stopping ] || exit 0; i=0; while pgrep -x phoc >/dev/null && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done; exit 0'
