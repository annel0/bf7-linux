# BF7: энергосбережение Wi-Fi включено для всех сетей.
#
# Без этой строки NetworkManager режим не трогает, а драйвер MediaTek по
# умолчанию держит его выключенным: радиочасть не спит между маяками точки
# доступа и принимает весь широковещательный шум сети.
#
# Замер 2026-09-23 (tools/bf7-kto-budit.sh, ssh по Wi-Fi, телефон на столе):
#                          выключено      включено
#   прерываний wlan0         9/с            6/с
#   приём / отдача         28 / 24 МБ/с   26,6 / 22,5 МБ/с (в пределах разброса)
#   ping редкий              2,6 мс         55 мс
#   ping плотный             —              3,3 мс
# Под нагрузкой чип не засыпает, так что скорость и отзывчивость в работе
# те же; задержка вырастает только у одиночных пакетов в тишине.
#
# Для одной сети вернуть как было: nmcli connection modify <имя>
# 802-11-wireless.powersave 2
[connection]
wifi.powersave=3
