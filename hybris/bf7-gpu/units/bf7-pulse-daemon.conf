# BF7: частота дискретизации сервера.
#
# Железо умеет и 48, и 44,1 кГц (DL1 проверен тоном 1000 Гц через микрофон,
# 2026-09-25). Основная частота — 48 кГц (системные звуки, видео, звонки).
# Музыка почти вся в 44,1 кГц: avoid-resampling переключает выход на её
# частоту, когда он свободен, и пересчёт не нужен вовсе. Замер: пересчёт
# 44,1→48 стоил PulseAudio ~8% ядра всё время, пока играет музыка.
default-sample-rate = 48000
alternate-sample-rate = 44100
avoid-resampling = yes
default-sample-format = s16le
default-sample-channels = 2

# Пересчёт частоты — самым дешёвым способом: качество здесь ни на что не
# влияет, потому что пересчитывать почти нечего, а ядра дороги.
resample-method = speex-fixed-1

# Высокий приоритет серверу не нужен: он не обслуживает разговоров.
high-priority = no
realtime-scheduling = no
