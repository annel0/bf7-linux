[Service]
# BF7: не поднимать плагины, которым тут не на чем работать. LE Audio (vcp,
# mcp, bap) требует ISO-сокетов, которых нет в ядре 4.19, а SIM Access (sap)
# — драйвера SIM для Bluetooth. Каждый из них на каждой загрузке писал в
# журнал ошибку уровня err и ничего не делал.
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap,vcp,mcp,bap
