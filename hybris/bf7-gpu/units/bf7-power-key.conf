# Кнопка питания на телефоне: короткое нажатие не должно ничего выключать.
#
# По умолчанию systemd-logind делает по короткому нажатию poweroff. На
# настольной машине это разумно, на телефоне — нет: кнопка под пальцем, и
# машинальное нажатие обрывает работу. А поскольку воткнут провод, MediaTek
# после выключения сразу включается обратно — со стороны это выглядит как
# самопроизвольная перезагрузка (так и случилось 2026-09-18).
#
# Короткое нажатие игнорируем, длинное оставляем как способ выключить нарочно.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
