# BF7: не запускать вход в систему на tty1, пока там живёт телефонный сеанс.
#
# phoc (через встроенный seatd) занимает tty1: переводит его в графический
# режим и выключает клавиатуру терминала. getty@tty1 — служба Type=idle, и
# systemd запускает её с задержкой до пяти секунд; при запуске он сбрасывает
# терминал (TTYReset, TTYVHangup) — и сбрасывал его уже ПОСЛЕ phoc. Замер
# 2026-09-23: seatd поставил графику в 52,24 с, «(agetty)» вернул текст в
# 53,17 с.
#
# Что от этого было:
#   - любое нажатие клавиши (кнопка питания, громкость, клавиатура Bluetooth)
#     уходило и в скрытое приглашение входа на tty1;
#   - текстовая консоль считалась видимой, и нажатие «будило» её: ядро
#     звало fb_blank(UNBLANK) из kworker в обход композитора и включало
#     усыплённый тракт экрана при погашенном выводе.
#
# Вход в систему есть и без tty1: последовательная консоль ttyGS0 по USB и
# ssh. Если телефонный сеанс выключить (systemctl disable bf7-phosh), условие
# снова пустит getty на tty1.
[Unit]
ConditionPathExists=!/etc/systemd/system/graphical.target.wants/bf7-phosh.service
