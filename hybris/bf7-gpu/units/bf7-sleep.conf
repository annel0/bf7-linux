# BF7: как systemd усыпляет телефон (systemctl suspend, logind, gsd-power).
#
# Глубокий сон (deep, через SPM MediaTek) — с 2026-09-24. Лёгкий сон (s2idle,
# «freeze») на этой плате почти не экономит: ~55 мА во сне против ~62 мА без
# сна (замер кулонометром без кабеля) — SoC не уходит в глубокие состояния.
# Глубокий сон испытан: будит RTC-будильник, кнопка питания и входящее SMS
# (модем, CCIF); после него живы Wi-Fi, данные, модем, Bluetooth, оболочка.
# Одна ловушка: в глубоком сне светилась подсветка (вывод ШИМ GPIO43) —
# крюк bf7-ekran-pered-snom переводит его в GPIO «0», bf7-posle-sna
# возвращает. Вернуться на лёгкий сон — SuspendState=mem.
#
# Спячки нет: подкачка — zram, образ памяти некуда класть.
[Sleep]
SuspendState=mem
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
