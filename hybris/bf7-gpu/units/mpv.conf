# BF7: системные настройки mpv (/etc/mpv/mpv.conf).
#
# Аппаратное декодирование через наш VA-драйвер (vaapi-shim → bf7-videod).
# Режим с копией: кадр без копий mpv взять не может — PowerVR не принимает
# плоскости по отдельности (R8/GR88), а mpv разбирает YUV именно так (см.
# память bf7-hw-accel-for-apps). Но и с копией ролик 720p обходится в ~74%
# процессора на весь телефон против ~130% у программного декодера
# (замер 2026-09-25). auto-copy сам уйдёт на процессор, если кодек не наш.
hwdec=auto-copy
