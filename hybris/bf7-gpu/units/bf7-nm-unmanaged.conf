# BF7: что NetworkManager трогать не должен.
#
# rndis0 — канал связи с хозяйским компьютером по USB, через него идёт ssh и
# вся отладка. Отдать его NetworkManager значит остаться без доступа.
# usb0 — то же под другим именем на некоторых сборках ядра.
# ccmni* — сетевые каналы модема, их ведёт своя часть вендорского слоя.
# dummy0, ifb*, ip_vti0, tunl0, gre* — служебные, интереса не представляют.
[keyfile]
unmanaged-devices=interface-name:rndis0;interface-name:usb0;interface-name:ccmni*;interface-name:dummy0;interface-name:ifb*;interface-name:ip_vti0;interface-name:tunl0;interface-name:gre*;interface-name:erspan*;interface-name:sit0;interface-name:teql0;interface-name:ip6*

[main]
# Разрешение имён оставляем systemd-resolved, если он есть; иначе обычный файл.
dns=default

[device]
# Случайный адрес при поиске сетей выключен: лишняя смена адреса драйверу MTK
# не нравится, а от неё тут пользы нет.
wifi.scan-rand-mac-address=no

[connection]
# Адрес обязан быть подменён, и вот почему. Собственный адрес драйвера —
# 00:08:22:1c:4f:fc, а 00:08:22 это заглушка MediaTek: с ней точка доступа не
# отвечает, посредник пишет «Association request to the driver failed».
# Настоящий адрес вендорский слой берёт из NVRAM, а у нас этого не происходит.
# «stable» даёт адрес, вычисленный из имени сети и машинного идентификатора:
# он случайный для стороннего наблюдателя, но одинаковый между перезагрузками,
# так что точка доступа видит один и тот же телефон.
wifi.cloned-mac-address=stable

# ap0, wlan1 — вторые интерфейсы Wi-Fi драйвера MediaTek. Управляемый ap0 NM
# раз в 2 минуты пытался сканировать, драйвер отвечал -22 (весь день в журнале
# «ap0: CTRL-EVENT-SCAN-FAILED»). ap0 нужен только точке доступа — bf7-tochka
# берёт его под управление на время раздачи (nmcli dev set ap0 managed yes).
# Именно так, а не в unmanaged-devices выше: оттуда запрет командой не снять.
[device-bf7-ap0]
match-device=interface-name:ap0;interface-name:wlan1
managed=0
