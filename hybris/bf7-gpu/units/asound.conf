# BF7: звук для обычных программ через ALSA напрямую.
#
# Почему не pipewire. Он (точнее wireplumber) перебирает все устройства карты,
# а их у mt-snd-card двадцать три: голосовые каналы модема, петли, TDM, SCP.
# Открытие одного из них роняет ядро — проверено дважды, оба раза
# androidboot.bootreason=kernel_panic ровно на запуске звукового сервера.
# Пока виновник не найден, к железу обращаемся только по двум известным
# рабочим адресам: hw:0,0 на воспроизведение и hw:0,1 на запись.
#
# Смешивать через dmix/dsnoop нельзя: они работают отображением памяти, а
# драйвер его не поддерживает — открытие отвечает «Function not implemented»
# (-38). Это же объясняет и падения ядра. Поэтому здесь только прямой путь, а
# смешивание нескольких программ берёт на себя PulseAudio, которому устройства
# заданы явно и который карту не перебирает.
#
# Аналоговый путь поднимает служба bf7-audio (см. /usr/local/bin/bf7-audio-up):
# ключи кодека принимаются только при уже работающем потоке.

pcm.!default {
	type plug
	slave.pcm "hw:0,0"
}

pcm.bf7in {
	type plug
	slave.pcm "hw:0,1"
}

ctl.!default {
	type hw
	card 0
}
