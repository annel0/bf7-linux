[Unit]
# BF7: конечный предел ожидания.
#
# У Type=oneshot systemd по умолчанию **отключает** таймаут, и общий
# DefaultTimeoutStartSec на такие службы не распространяется — это прямо
# сказано в systemd.service(5). Значит, любая наша oneshot-служба может висеть
# вечно, и загрузка вместе с ней. Однажды так и вышло: bf7-wifi не смог
# вставить wmt_drv, завис навсегда, systemd остался в состоянии «starting», и
# телефон выглядел незагрузившимся — отвечал только на ping. Спасаться пришлось
# телнетом из initramfs.
#
# Провалившаяся служба хуже работающей, но лучше повисшей: при отказе хотя бы
# поднимается ssh и видно, что именно сломалось.

[Service]
TimeoutStartSec=90
