[Unit]
# BF7: NetworkManager должен подниматься после посредника.
#
# При загрузке он трижды напоролся на «Couldn't initialize supplicant
# interface»: обычно wpa_supplicant поднимается по запросу через шину, но на
# нашем неспешном железе это не успевает, а после пяти попыток NetworkManager
# сдаётся навсегда.
After=wpa_supplicant.service
Wants=wpa_supplicant.service

[Service]
# Остатки сокетов управления мешают посреднику завести интерфейс. В /run они
# не переживают перезагрузку, но переживают смену механизма на ходу.
#
# Долгое время я считал эти остатки причиной. Причина была хуже: служба
# bf7-static-wifi несла Requires=bf7-wpa.service, а Requires= запускает даже
# выключенную службу. Второй wpa_supplicant садился на wlan0 первым, держал
# /run/wpa_supplicant/wlan0, и системный писал «ctrl_iface exists and seems to
# be in use — cannot override it». NetworkManager бесконечно пересоздавал
# интерфейс и объявлял wlan0 недоступным. Обе службы сняты и замаскированы
# (копии в units/отставлены/); маскировка здесь обязательна, потому что
# простого «disabled» Requires= не слушается.
ExecStartPre=/bin/sh -c "rm -f /run/wpa_supplicant/wlan0 /run/wpa_supplicant/wlan1 /run/wpa_supplicant/ap0 || true"
# Сам интерфейс при загрузке ещё не готов, и посредник отвечает
# «wpa_supplicant couldn't grab this interface». Опускание и поднятие это
# лечит — проверено вручную.
ExecStartPre=/bin/sh -c "ip link set wlan0 down 2>/dev/null; sleep 1; ip link set wlan0 up 2>/dev/null; sleep 2; true"
Restart=on-failure
RestartSec=5
