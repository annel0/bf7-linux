# BF7: настройка композитора phoc для телефонного сеанса.
# Ставится в /etc/phosh/phoc.ini — этот путь phoc предпочитает своему
# /usr/share/phosh/phoc.ini.
#
# ВНИМАНИЕ. Здесь НЕ должно быть раздела [output:DSI-1] со строкой scale.
# Проверено перебором: с ней phoc печатает
#     [types/output/output.c:656] Basic output test failed for DSI-1
# выходов у него не оказывается вовсе, и Phosh прекращает работу с
# «Wayland compositor lacks needed globals». Без неё всё поднимается, а
# масштаб оболочка и так выбирает верно — 2.0 по плотности 294 точки на дюйм.

[core]
xwayland = true
