# BF7: огонёк уведомлений у фронтальной камеры (ISINK1 PMIC MT6357) включён
# наоборот — горел постоянно при яркости 0 и гас при включении. Проверено
# камерой 2026-09-30: с инверсией (ядро v9, leds-mt6357) в покое тёмный, а
# узор feedbackd даёт видимые вспышки. Сразу после — яркость 0, чтобы
# погасить огонёк, зажжённый при загрузке без инверсии.
w /sys/module/leds_mt6357/parameters/bf7_invert_isink1 - - - - 1
w /sys/class/leds/blue/brightness - - - - 0
