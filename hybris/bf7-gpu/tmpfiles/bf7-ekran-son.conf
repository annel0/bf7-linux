# BF7: гасить весь тракт экрана, а не только подсветку.
#
# Когда композитор выключает вывод (по простою или кнопкой питания),
# bf7_drm усыпляет панель, канал DSI и блок дисплея — через fb_blank(), как
# штатный Android, с оповещениями вендорских правил «экран погашен».
# Без этого панель обновлялась 60 раз в секунду с погашенной подсветкой, а
# держатель pri_disp_wakelock не отпускался никогда — и ядро отменяло любую
# попытку сна.
#
# Цена: тачскрин TD4160 — одна микросхема с дисплеем и засыпает вместе с
# панелью. Погасший экран будит только кнопка питания, касание — нет (пока
# экран лишь притушен перед гашением, касание будит как прежде).
#
# Проверка: tools/bf7-ekran-son-proverka.sh.
# Вернуть прежнее поведение на лету:
#   echo 0 > /sys/module/bf7_drm/parameters/usyplyat_panel
w /sys/module/bf7_drm/parameters/usyplyat_panel - - - - 1
