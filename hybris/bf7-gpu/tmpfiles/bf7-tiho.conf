# BF7: утихомирить болтливые драйверы при каждой загрузке.
#
# Опрос термодатчиков питания (tsbuck1/tsbuck2) пишет в журнал около сотни
# строк в минуту: драйвер в probe безусловно включает свой «отладочный»
# вывод, а тот идёт через pr_notice, то есть в журнал по-настоящему.
# Исправлено и в исходниках ядра (thermal_zones/mtk_ts_pmic.c), но эта строка
# нужна, пока на телефоне ядро без той правки, — и безвредна после.
#
# Вернуть подробный вывод: echo 1 > /proc/driver/thermal/tzpmic_log
w /proc/driver/thermal/tzpmic_log - - - - 0

# Мигающий курсор текстовой консоли будил процессор пять раз в секунду
# (cursor_timer_handler и fb_flashcursor в замере tools/bf7-kto-budit.sh),
# хотя консоль под композитором не видна никогда — терминал в графическом
# режиме. Курсор остаётся, только не мигает.
w /sys/class/graphics/fbcon/cursor_blink - - - - 0
