# BF7: сон телефона без переключения терминала.
#
# Драйвер сна MediaTek (spm/common/mtk_sleep.c, при SLP_SUSPEND_LOG_EN)
# принудительно ставит console_suspend_enabled = 0 — чтобы консоли печатали и
# во сне. Побочное действие: pm_vt_switch() тогда ВСЕГДА требует
# переключить терминал перед сном, и наш skip_vt_switch в mtkfb не помогает.
# Ядро шлёт владельцу tty1 (seatd внутри phoc) сигнал SIGUSR1 и ждёт
# ответа — а у seatd этот сигнал заблокирован (маску он наследует от phoc
# при fork). Итог: rtcwake навсегда застревает в vt_waitactive, как в обеих
# пробах 2026-09-23.
#
# Y возвращает обычное поведение: консоли засыпают вместе с системой, а
# переключение терминала не нужно (mtkfb зарегистрирован с required=false).
# Проверено: сон freeze входит и выходит по будильнику.
w /sys/module/printk/parameters/console_suspend - - - - Y
